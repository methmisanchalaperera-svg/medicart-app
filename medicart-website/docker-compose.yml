npm run dev --prefix clientservices:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicart
      POSTGRES_USER: medicart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - medicart_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicart -d medicart"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  medicart_db:
